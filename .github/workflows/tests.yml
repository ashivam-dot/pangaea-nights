name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -q -r requirements/base.txt -r requirements/plan.txt pytest pyyaml
      - run: python -m pytest -q tests

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg tesseract-ocr
      - run: pip install -q -r requirements/base.txt
      - run: python tests/smoke.py smoke-out
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke
          path: |
            smoke-out/episode.mp4
            smoke-out/short0.mp4
            smoke-out/thumbnail.jpg
            smoke-out/checks
            smoke-out/stills
            smoke-out/timeline.json
          retention-days: 5
