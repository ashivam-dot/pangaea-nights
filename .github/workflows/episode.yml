name: episode

on:
  schedule:
    # Tue and Fri. A 2-hour build takes ~3.5 h and a 3-hour one ~4.5 h, so both land well before the 21:00 UTC
    # premiere (config.EPISODE_SLOT_UTC). The 08:00 UTC Shorts run is normally done by ~12:00; if it is not, the plan
    # job waits before fanning out (studio/fanout.py), so the two never exceed the 20 concurrent free-plan jobs.
    - cron: "10 14 * * 2,5"
  workflow_dispatch:
    inputs:
      mode:
        description: "publish = upload and schedule; dry = full length, never uploads; short = 2-chapter test"
        type: choice
        options: [dry, short, publish]
        default: dry
      writer:
        description: "auto = Gemini if GEMINI_API_KEY exists, else the unpublishable stub"
        type: choice
        options: [auto, gemini, stub]
        default: auto
      topic:
        description: "backlog topic id (optional)"
        type: string
        default: ""
      length:
        description: "auto = alternate 2 h / 3 h by episode (the length experiment); 2h or 3h forces one"
        type: choice
        options: [auto, 2h, 3h]
        default: auto

concurrency:
  group: episode-${{ github.event.inputs.mode || 'publish' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  issues: write

env:
  MODE: ${{ github.event.inputs.mode || 'publish' }}
  PANGAEA_WORK: ${{ github.workspace }}/work
  PANGAEA_STATE: ${{ github.workspace }}/state
  PANGAEA_MODELS: /mnt/models
  PAUSED: ${{ vars.PAUSED }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  plan:
    if: github.event_name != 'schedule' || vars.PAUSED == 'false'
    runs-on: ubuntu-24.04
    environment: youtube
    timeout-minutes: 330  # the 3-hour shape writes 21 chapters (210), then up to 120 waiting for the Shorts
    outputs:
      images: ${{ steps.matrix.outputs.images }}
      voice: ${{ steps.matrix.outputs.voice }}
      render: ${{ steps.matrix.outputs.render }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: State branch
        run: |
          git fetch --depth 1 origin state
          git worktree add state FETCH_HEAD
      - name: Install
        run: pip install -q -r requirements/base.txt -r requirements/plan.txt
      - name: Length (2 h / 3 h experiment)
        if: env.MODE != 'short'
        env:
          LENGTH: ${{ github.event.inputs.length || 'auto' }}
        run: python -m studio.length --choice "$LENGTH"
      - name: Shards
        id: matrix
        run: |
          shape=full
          if [ "$MODE" = "short" ]; then shape=short; fi
          python -m studio.cli matrix --shape "$shape"
      - name: Write the script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WRITER: ${{ github.event.inputs.writer || 'gemini' }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          shape=full
          if [ "$MODE" = "short" ]; then shape=short; fi
          python -m studio.cli plan --mode "$MODE" --shape "$shape" --writer "$WRITER" --topic "$TOPIC"
      - uses: actions/upload-artifact@v5
        with:
          name: plan
          path: work/episode.json
          retention-days: 3
      # Last, so the matrix outputs (18 image + 2 voice jobs) are only released once no Shorts run holds runners.
      - name: Wait for the Shorts (20 concurrent jobs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m studio.fanout --wait-for shorts.yml --minutes 120

  images:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    strategy:
      fail-fast: true
      matrix:
        k: ${{ fromJSON(needs.plan.outputs.images) }}
    env:
      K: ${{ matrix.k }}
      N: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v5
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/models && sudo chown "$USER" /mnt/models
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -q -r requirements/base.txt -r requirements/ml.txt
      - uses: actions/download-artifact@v6
        with:
          name: plan
          path: work
      - name: Generate
        run: python -m studio.cli images "$K" "$N"
      - uses: actions/upload-artifact@v5
        with:
          name: img-${{ matrix.k }}
          path: |
            work/images/*.jpg
            work/images/*.depth.png
            work/images/thumb.png
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        with:
          name: rep-${{ matrix.k }}
          path: work/images/shard-*.json
          retention-days: 7

  voice:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        k: ${{ fromJSON(needs.plan.outputs.voice) }}
    env:
      K: ${{ matrix.k }}
      N: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
      - run: pip install -q -r requirements/base.txt -r requirements/ml.txt -r requirements/voice.txt
      - uses: actions/download-artifact@v6
        with:
          name: plan
          path: work
      - name: Narrate
        run: python -m studio.cli voice "$K" "$N"
      - uses: actions/upload-artifact@v5
        with:
          name: voice-${{ matrix.k }}
          path: work/voice
          retention-days: 3

  audio:
    needs: [plan, images, voice]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements/base.txt
      - uses: actions/download-artifact@v6
        with:
          name: plan
          path: work
      - uses: actions/download-artifact@v6
        with:
          pattern: rep-*
          path: work/reports
          merge-multiple: true
      - uses: actions/download-artifact@v6
        with:
          pattern: voice-*
          path: work/voice
          merge-multiple: true
      - name: Timeline and mix
        run: python -m studio.cli audio
      - uses: actions/upload-artifact@v5
        with:
          name: audio
          path: |
            work/timeline.json
            work/audio.json
            work/mix.m4a
          retention-days: 3

  render:
    needs: [plan, images, audio]
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    strategy:
      fail-fast: true
      matrix:
        k: ${{ fromJSON(needs.plan.outputs.render) }}
    env:
      K: ${{ matrix.k }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements/base.txt
      - uses: actions/download-artifact@v6
        with:
          name: audio
          path: work
      - uses: actions/download-artifact@v6
        with:
          pattern: img-*
          path: work/images
          merge-multiple: true
      - name: Render
        run: python -m studio.cli render "$K"
      - uses: actions/upload-artifact@v5
        with:
          name: seg-${{ matrix.k }}
          path: work/segments
          retention-days: 2
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        with:
          name: stills-${{ matrix.k }}
          path: work/stills
          retention-days: 7
          if-no-files-found: ignore

  finish:
    needs: [plan, images, voice, audio, render]
    runs-on: ubuntu-24.04
    environment: youtube
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg tesseract-ocr
      - run: pip install -q -r requirements/base.txt -r requirements/ml.txt -r requirements/publish.txt
      - uses: actions/download-artifact@v6
        with:
          name: plan
          path: work
      - uses: actions/download-artifact@v6
        with:
          name: audio
          path: work
      - uses: actions/download-artifact@v6
        with:
          pattern: voice-*
          path: work/voice
          merge-multiple: true
      - uses: actions/download-artifact@v6
        with:
          pattern: img-*
          path: work/images
          merge-multiple: true
      - uses: actions/download-artifact@v6
        with:
          pattern: seg-*
          path: work/segments
          merge-multiple: true
      - name: Assemble, check, thumbnail (trailer Shorts only if config.TRAILER_SHORTS)
        run: python -m studio.cli finish
      - name: Publish (refuses unless every guard passes)
        env:
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m studio.cli publish --mode "$MODE"
      - name: Record in the ledger
        if: always()
        run: |
          git fetch --depth 1 origin state
          git worktree add state FETCH_HEAD
          python -m studio.cli record
          cd state
          git add ledger.json
          git -c user.name=pangaea-nights-bot -c user.email=actions@users.noreply.github.com commit -q -m "ledger: run $GITHUB_RUN_ID" || true
          git push origin HEAD:state
      - name: Alert on a read-back mismatch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s work/out/alerts.txt ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --label alert \
              --title "Episode read-back mismatch ($(date -u +%Y-%m-%d))" --body-file work/out/alerts.txt
          fi
      - name: Review files
        if: always()
        run: |
          mkdir -p review
          cp -r work/out/checks review/ 2>/dev/null || true
          cp work/out/*.json work/out/*.jpg work/out/excerpt-*.mp4 work/out/short*.mp4 review/ 2>/dev/null || true
          cp work/episode.json work/timeline.json work/audio.json review/ 2>/dev/null || true
          if [ "$MODE" = "short" ]; then cp work/out/episode.mp4 review/ 2>/dev/null || true; fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: review
          path: review
          retention-days: 14

  alert:
    needs: [plan, images, voice, audio, render, finish]
    if: failure() && (github.event_name == 'schedule' || github.event.inputs.mode == 'publish')
    runs-on: ubuntu-24.04
    steps:
      - name: Open an alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --label alert \
            --title "Episode failed ($(date -u +%Y-%m-%d))" \
            --body "The scheduled episode run failed: $RUN_URL"
